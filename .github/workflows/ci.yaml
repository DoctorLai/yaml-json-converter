name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Node.js (version pinned via .nvmrc)
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # Install dependencies from the lockfile
      - name: Install dependencies
        run: npm ci

      # Check formatting with Prettier
      - name: Check formatting
        run: npm run format

      # Lint with ESLint
      - name: Lint
        run: npm run lint

      # Run tests
      - name: Run tests
        run: npm run test
        env:
          CI: true
          NODE_OPTIONS: --enable-source-maps --max-old-space-size=4096

      # Build the project
      - name: Build the project
        run: npm run build

